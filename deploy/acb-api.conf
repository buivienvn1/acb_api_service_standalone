[program:acb-api-web]
directory=/opt/acb-api
command=/opt/acb-api/venv/bin/python -m uvicorn acb_api_service.app:app --host 127.0.0.1 --port 8091 --workers 1 --no-access-log
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/acb-api-web.out.log
stderr_logfile=/var/log/acb-api-web.err.log
environment=PYTHONUNBUFFERED="1"

[program:acb-api-worker]
directory=/opt/acb-api
command=/opt/acb-api/venv/bin/python -m acb_api_service.worker
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/acb-api-worker.out.log
stderr_logfile=/var/log/acb-api-worker.err.log
environment=PYTHONUNBUFFERED="1"

[group:acb-api]
programs=acb-api-web,acb-api-worker
priority=999
